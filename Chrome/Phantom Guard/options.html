<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>PhantomGuard Options</title>
        <style>
            body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
                margin: 20px;
                background-color: #f9f9f9;
                color: #333;
            }
            h1 {
                text-align: center;
                color: #ff0000;
            }
            h2 {
                margin-top: 20px;
            }
            .scrollbox {
                width: 100%;
                max-width: 600px;
                height: 200px;
                overflow-y: scroll;
                border: 1px solid #000;
                margin: 10px 0;
                padding: 10px;
                background-color: #fff;
            }
            form {
                margin: 10px 0;
            }
            input[type="text"], input[type="file"] {
                padding: 5px;
                margin-right: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }
            input[type="checkbox"] {
                margin-right: 5px;
            }
            button {
                padding: 5px 10px;
                border: none;
                border-radius: 4px;
                background-color: #007bff;
                color: white;
                cursor: pointer;
            }
            button:hover {
                background-color: #0056b3;
            }
            li {
                margin: 5px 0;
                display: flex;
                align-items: center;
            }
            li button {
                margin-left: 10px;
                background-color: #dc3545;
            }
            li button:hover {
                background-color: #c82333;
            }
            .toggle-section {
                margin: 20px 0;
            }
            .import-export-section {
                margin: 20px 0;
            }
            ul ul {
                margin-left: 20px;
                margin-top: 5px;
            }
            li span {
                flex: 1;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background-color: #333;
                    color: #f9f9f9;
                }
                .scrollbox {
                    background-color: #444;
                    border-color: #666;
                }
                input[type="text"], input[type="file"] {
                    background-color: #555;
                    color: #f9f9f9;
                    border-color: #777;
                }
            }
        </style>
    </head>
    <body>
        <h1>PhantomGuard Options</h1>
        <h2>Blocked Elements</h2>
        <ul id="elementBlocklist" class="scrollbox"></ul>
        <form id="blockListForm">
            <label for="blockListInput">Upload Blocklist File:</label>
            <input type="file" id="blockListInput">
            <button type="submit">Upload</button>
        </form>
        <form id="domainForm">
            <label for="domainInput">Block Domain:</label>
            <input type="text" id="domainInput" placeholder="e.g., https://example.com">
            <button type="submit">Add</button>
        </form>
        <h2>Blocked Domains</h2>
        <ul id="domainBlocklist" class="scrollbox"></ul>
        <form id="trackerForm">
            <label for="trackerInput">Block Tracker:</label>
            <input type="text" id="trackerInput" placeholder="e.g., tracker.example.com">
            <button type="submit">Add</button>
        </form>
        <h2>Blocked Trackers</h2>
        <ul id="trackerBlocklist" class="scrollbox"></ul>
        <div class="toggle-section">
            <label>
                <input type="checkbox" id="usePredefinedBlocklist" checked>
                Use Predefined Blocklist
            </label>
            <br>
            <label>
                <input type="checkbox" id="usePredefinedTrackers" checked>
                Use Predefined Tracker List
            </label>
        </div>
        <div class="import-export-section">
            <button id="exportSettings">Export Settings</button>
            <label for="importSettings">Import Settings:</label>
            <input type="file" id="importSettings" accept=".json">
        </div>
        <script src="options.js"></script>
    </body>
</html>
